# =============================================================================
# sites/teesta.yaml  —  Teesta cascade: South Lhonak GLOF -> Teesta III (schema v1)
#
# EVERY VALUE BELOW IS A PLACEHOLDER.
# Numbers and coordinates are rough, unchecked guesses so the pipeline can run
# end-to-end. None of them may be used for a real result. Each `source` says
# where the real value should come from; set status: sourced only after
# replacing the value and writing the full citation.
# Field-object rules: see sites/template.yaml.
# =============================================================================

schema_version: 1

site:
  id: teesta
  name: Teesta basin - South Lhonak Lake and Teesta III (Chungthang)
  region: Sikkim (Mangan, Gangtok, Pakyong districts); West Bengal (Kalimpong, Jalpaiguri)
  river: Teesta

crs:
  utm_epsg:
    value: 32645                   # WGS 84 / UTM zone 45N
    unit: epsg
    source: "Derived: WGS 84 / UTM zone 45N covers 84E-90E (EPSG registry); the far-field bbox (88.10-88.85E) lies entirely inside it, so EPSG:32645 follows deterministically from the bbox alone. No DEM chosen yet (docs/progress.md, DEM comparison report pending) -- if a chosen DEM's native CRS differs, this stays correct since we reproject on load."
    status: sourced

domains:
  far_field:
    description: South Lhonak Lake to Teesta Barrage (Gajoldoba)
    bbox:
      value: [88.10, 26.65, 88.85, 28.00]
      unit: deg
      source: "UNVERIFIED guess. Replace from: flood-path envelope digitised on the DEM, lake outlet to downstream limit plus buffer."
      status: placeholder
    grid_resolution:
      value: 30
      unit: m
      source: "Placeholder, leaning Copernicus GLO-30 (src_034) over SRTM GL1 (src_033): both are
        30 m, but SRTM has known voids/artefacts in steep Himalayan terrain that GLO-30 generally
        avoids (it's derived from the newer TanDEM-X mission with radar-shadow infill). Not yet
        decided -- backend/m1_terrain/download.py fetches both, and the M1-2 comparison report
        (void %, difference maps, valley profiles) makes the final call, which may still be SRTM
        or CartoDEM if the report shows otherwise for this site."
      status: placeholder
    inflow:
      from: south_lhonak
      location:
        value: [88.200, 27.905]
        unit: deg
        source: "UNVERIFIED guess. Replace from: South Lhonak outlet channel snapped to the DEM stream network."
        status: placeholder

  near_field:
    description: Lachen Chu approach, Teesta III dam and Chungthang town
    bbox:
      value: [88.60, 27.56, 88.69, 27.65]
      unit: deg
      source: "UNVERIFIED guess. Replace from: box around Teesta III dam and Chungthang drawn on high-resolution imagery."
      status: placeholder
    grid_resolution:
      value: 10
      unit: m
      source: "Placeholder. Replace with the resolution of the finest DEM available here (CartoDEM, ALOS, drone or LiDAR)."
      status: placeholder
    inflow:
      from: far_field
      location:
        value: [88.625, 27.635]
        unit: deg
        source: "UNVERIFIED guess. Replace from: Lachen Chu centreline where it crosses the near-field upstream boundary."
        status: placeholder

dams:
  - id: south_lhonak
    name: South Lhonak Lake (moraine dam)
    kind: moraine_dammed_lake
    triggered_by: null
    equations_applicable: true       # not concrete_dam; moraine treated as HD (see dam_type below)
    location:
      value: [88.200, 27.910]
      unit: deg
      source: "UNVERIFIED guess. Replace from: moraine crest centre digitised on pre-event imagery."
      status: placeholder
    breach_location:
      value: [88.200, 27.905]
      unit: deg
      source: "UNVERIFIED guess. Replace from: breach channel mapped on post-event imagery."
      status: placeholder
    breach_inputs:
      water_volume_above_invert:
        value: 50000000            # 50 Mm^3
        unit: m^3
        source: "UNVERIFIED order-of-magnitude guess. Replace from: post-event drained-volume estimates (NRSC/ISRO, CWC, peer-reviewed studies) or pre-event bathymetry."
        status: placeholder
      water_height_above_invert:
        value: 20
        unit: m
        source: "UNVERIFIED guess. Replace from: pre-event lake level minus post-event breach invert (DEM differencing)."
        status: placeholder
      breach_height:
        value: 20
        unit: m
        source: "UNVERIFIED guess. Replace from: pre- vs post-event DEM across the breach."
        status: placeholder
      dam_height:
        value: 30
        unit: m
        source: "UNVERIFIED guess. Replace from: moraine crest minus downstream toe on the pre-event DEM."
        status: placeholder
      average_embankment_width:
        value: 300
        unit: m
        source: "UNVERIFIED guess. Replace from: (crest width + base width) / 2 measured on pre-event DEM cross-section."
        status: placeholder
      dam_type:
        value: HD
        unit: enum
        source: "Placeholder: no moraine class in the equations; HD used as the nearest analogue. Confirm the choice with your guide."
        status: placeholder
      failure_mode:
        value: O
        unit: enum
        source: "Placeholder. Replace from: post-event studies of the 2023 failure mechanism."
        status: placeholder
      erodibility:
        value: H
        unit: enum
        source: "Placeholder: loose moraine assumed highly erodible. Replace from: field/geotechnical description in post-event studies."
        status: placeholder

    volume_elevation:
      method: area_volume_relation
      area_volume_exponent_b:
        value: null
        unit: "-"
        source: "NOT SOURCED. Replace from: a published lake area-volume relation for moraine-dammed glacial lakes (e.g. regional GLOF studies), or a surveyed_curve if pre-event bathymetry/DEM-derived elevation-volume points exist."
        status: placeholder

  - id: teesta_iii
    name: Teesta III dam (Chungthang)
    kind: embankment_dam
    triggered_by: south_lhonak
    equations_applicable: true       # kind is embankment_dam (believed concrete-faced rockfill,
                                      # dam_type: FD below), not concrete_dam -- the Xu & Zhang FD
                                      # class covers CFRDs, so the equations are not blocked here
                                      # (docs/Equations.md §7 only refuses kind: concrete_dam).
    trigger:
      type: inflow_threshold
      value:
        value: null
        unit: m^3/s
        source: "NOT SOURCED. Replace from: Teesta III spillway/outlet discharge capacity (project DPR / CWC) or official 2023 failure timeline (when routed South Lhonak flow overwhelmed the dam)."
        status: placeholder
    location:
      value: [88.640, 27.600]
      unit: deg
      source: "UNVERIFIED guess. Replace from: CWC National Register of Large Dams or project layout drawings."
      status: placeholder
    breach_location:
      value: [88.640, 27.600]
      unit: deg
      source: "UNVERIFIED guess. Replace from: breach location mapped on post-event imagery."
      status: placeholder
    breach_inputs:
      water_volume_above_invert:
        value: 5000000             # 5 Mm^3
        unit: m^3
        source: "UNVERIFIED guess. Replace from: reservoir elevation-storage curve (project DPR / Teesta Urja Ltd) at the failure water level."
        status: placeholder
      water_height_above_invert:
        value: 62
        unit: m
        source: "UNVERIFIED guess (crest height plus overtopping head). Replace from: peak water level at failure minus breach invert."
        status: placeholder
      breach_height:
        value: 60
        unit: m
        source: "UNVERIFIED guess (full-height breach assumed). Replace from: post-event survey or DEM differencing."
        status: placeholder
      dam_height:
        value: 60
        unit: m
        source: "UNVERIFIED guess. Replace from: CWC National Register of Large Dams or project DPR."
        status: placeholder
      average_embankment_width:
        value: 95
        unit: m
        source: "UNVERIFIED guess. Replace from: typical cross-section in project drawings, (crest width + base width) / 2."
        status: placeholder
      dam_type:
        value: FD
        unit: enum
        source: "UNVERIFIED guess (believed concrete-faced rockfill). Replace from: CWC National Register of Large Dams or project DPR."
        status: placeholder
      failure_mode:
        value: O
        unit: enum
        source: "Placeholder. Replace from: official post-event failure reports."
        status: placeholder
      erodibility:
        value: M
        unit: enum
        source: "Placeholder: rockfill assumed medium. Replace from: embankment material description in project documents."
        status: placeholder

    volume_elevation:
      method: area_volume_relation
      area_volume_exponent_b:
        value: null
        unit: "-"
        source: "NOT SOURCED. Replace from: Teesta III's reservoir elevation-storage curve (project DPR / Teesta Urja Ltd) as a surveyed_curve, which is preferable to an area-volume_relation exponent for a man-made reservoir."
        status: placeholder

    initial_water_level:
      value: null
      unit: m
      source: "NOT SOURCED. Replace from: Teesta III's Full Reservoir Level / Minimum Draw Down Level (project DPR / CWC), or the reported reservoir level just before the 2023-10-04 failure."
      status: placeholder

# Cascade: South Lhonak GLOF triggers Teesta III (docs/decisions.md, "M2 cascade engine").
# approach: two_stage_imposed — M2 does not route the flood itself. Teesta III's own hydrograph
# fires when routed South Lhonak inflow (from the far-field Delft3D run, or M5's HAND fallback)
# reaches teesta_iii.trigger.value above; t_offset_s in its sidecar is that arrival time.
cascade:
  approach: two_stage_imposed

